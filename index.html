<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ffe6f0, #ffffff);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Dancing Script', cursive;
  overflow: hidden;
}

/* CONTAINER */
.container {
  width: 80%;
  max-width: 800px;
  text-align: center;
  position: relative;
}

/* TEXT */
.text-box {
  font-size: 48px;
  color: #e60073;
  min-height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.5s ease;
}

/* ARROW */
.arrow {
  margin-top: 30px;
  font-size: 40px;
  cursor: pointer;
  color: #e60073;
  transition: 0.3s;
}

.arrow:hover {
  transform: translateX(10px);
}

/* MUSIC BUTTON */
.music-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #e60073;
  color: white;
  border: none;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  font-size: 20px;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

/* HEARTS */
.heart {
  position: absolute;
  bottom: -30px;
  animation: floatUp linear forwards;
  opacity: 0.85;
  pointer-events: none;
}

@keyframes floatUp {
  0% {
    transform: translateY(0) translateX(0) rotate(0deg);
  }
  50% {
    transform: translateY(-50vh) translateX(25px) rotate(180deg);
  }
  100% {
    transform: translateY(-110vh) translateX(-25px) rotate(360deg);
    opacity: 0;
  }
}

</style>
</head>

<body>

<!-- MUSIC -->
<audio id="bgMusic" loop autoplay>
  <source src="your-music.mp3" type="audio/mp3">
</audio>

<button class="music-btn" id="musicBtn">⏸</button>

<div class="container">
  <div id="text" class="text-box"></div>
  <div id="arrow" class="arrow">➜</div>
</div>

<script>

const texts = [
  "Happy Birthday my love 💋",
  "May this year bring you all that you wish to have, and all that you deserve ✨",
  "and..",
  "I'm sorry for arguing on such a small thing, I'll try to be better and try to notice more and be more aware. Thank you for bearing with me ",
  "I love you, and I hope this year goes great for you 💖"
];

let index = 0;

const textEl = document.getElementById("text");
const arrow = document.getElementById("arrow");

/* INIT */
textEl.innerHTML = texts[index];

/* NEXT TEXT */
arrow.addEventListener("click", () => {

  index++;

  if (index < texts.length) {
    changeText(texts[index]);
  } else {
    arrow.style.display = "none"; // stop at last text
  }

});

/* TRANSITION */
function changeText(newText) {
  textEl.style.opacity = 0;

  setTimeout(() => {
    textEl.innerHTML = newText;
    textEl.style.opacity = 1;
  }, 300);
}

/* ❤️ CONTINUOUS HEARTS */
function startHearts() {

  setInterval(() => {

    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";

    heart.style.left = Math.random() * 100 + "vw";

    let size = Math.random() * 25 + 15;
    heart.style.fontSize = size + "px";

    heart.style.animationDuration = (Math.random() * 4 + 4) + "s";

    heart.style.filter = `blur(${Math.random() * 1}px)`;

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 8000);

  }, 180);

}

/* START HEARTS IMMEDIATELY */
startHearts();

/* 🎵 MUSIC CONTROL */
const music = document.getElementById("bgMusic");
const musicBtn = document.getElementById("musicBtn");

/* AUTOPLAY FALLBACK (important for Chrome etc.) */
window.addEventListener("click", () => {
  if (music.paused) {
    music.play().catch(() => {});
  }
}, { once: true });

let playing = true;

musicBtn.addEventListener("click", () => {

  if (playing) {
    music.pause();
    musicBtn.innerHTML = "▶";
  } else {
    music.play();
    musicBtn.innerHTML = "⏸";
  }

  playing = !playing;

});

</script>

</body>
</html>
